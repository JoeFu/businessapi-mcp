name: Sandbox end-to-end (manual)

# Runs `businessapi-mcp doctor` against the vendor sandbox. Needs the repository secret BAPI_TEST_API_KEY
# (a bapi_sk_test_… key). Free: the sandbox bills nothing and reaches no production registry.

on:
  workflow_dispatch:
    inputs:
      lodge:
        description: "Also lodge the example payloads (--lodge)"
        type: boolean
        default: false

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Doctor
        env:
          BAPI_API_KEY: ${{ secrets.BAPI_TEST_API_KEY }}
        run: uv run businessapi-mcp doctor ${{ inputs.lodge && '--lodge' || '' }}
