name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --group dev
      - name: Unit tests (offline, no API key)
        run: uv run pytest
      - name: Build sdist + wheel
        run: uv build
      - name: CLI smoke
        run: |
          uv run businessapi-mcp --version
          uv run businessapi-mcp status
          uv run businessapi-mcp install mcp-json --dry-run
