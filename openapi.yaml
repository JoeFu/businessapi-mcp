      - cancellationProvision
      - shareClasses
      title: Asic484ShareCancellation
      type: object
    Asic484ShareCancellationClass:
      additionalProperties: false
      properties:
        classCode:
          maxLength: 4
          title: Classcode
          type: string
        classTitle:
          maxLength: 60
          title: Classtitle
          type: string
        totalNumberCancelled:
          minimum: 0
          title: Totalnumbercancelled
          type: integer
        totalConsiderationPaid:
          minimum: 0
          title: Totalconsiderationpaid
          type: integer
      required:
      - classCode
      - classTitle
      - totalNumberCancelled
      - totalConsiderationPaid
      title: Asic484ShareCancellationClass
      type: object
    Asic484ShareIssue:
      additionalProperties: false
      properties:
        earliestDateOfIssue:
          format: date
          title: Earliestdateofissue
          type: string
        sharesIssuedForCashOnlyIndicator:
          title: Sharesissuedforcashonlyindicator
          type: boolean
        sharesIssuedUnderWrittenContractIndicator:
          title: Sharesissuedunderwrittencontractindicator
          type: boolean
        descriptionOfConsideration:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Required in practice when not cash-only; printable ASCII
          title: Descriptionofconsideration
        shareClasses:
          items:
            $ref: '#/components/schemas/Asic484ShareIssueClass'
          minItems: 1
          title: Shareclasses
          type: array
      required:
      - earliestDateOfIssue
      - sharesIssuedForCashOnlyIndicator
      - sharesIssuedUnderWrittenContractIndicator
      - shareClasses
      title: Asic484ShareIssue
      type: object
    Asic484ShareIssueClass:
      additionalProperties: false
      properties:
        classCode:
          maxLength: 4
          title: Classcode
          type: string
        classTitle:
          maxLength: 60
          title: Classtitle
          type: string
        totalNumberInIssue:
          description: Number of shares issued in this transaction
          minimum: 0
          title: Totalnumberinissue
          type: integer
        amountPaid:
          minimum: 0
          title: Amountpaid
          type: integer
        amountDue:
          minimum: 0
          title: Amountdue
          type: integer
      required:
      - classCode
      - classTitle
      - totalNumberInIssue
      - amountPaid
      - amountDue
      title: Asic484ShareIssueClass
      type: object
    Asic484ShareStructure:
      additionalProperties: false
      description: A share class as it stands AFTER the change. Totals must equal the sum of the members rows for the class
        (ASIC V455).
      properties:
        classCode:
          description: e.g. ORD
          maxLength: 4
          title: Classcode
          type: string
        classTitle:
          description: e.g. ORDINARY
          maxLength: 60
          title: Classtitle
          type: string
        numberIssued:
          minimum: 0
          title: Numberissued
          type: integer
        totalAmountPaid:
          minimum: 0
          title: Totalamountpaid
          type: integer
        totalAmountUnpaid:
          minimum: 0
          title: Totalamountunpaid
          type: integer
        status:
          description: AP new class · DC details changed · NO whole class ceasing
          enum:
          - AP
          - DC
          - 'NO'
          title: Status
          type: string
        earliestDateOfChange:
          format: date
          title: Earliestdateofchange
          type: string
      required:
      - classCode
      - classTitle
      - numberIssued
      - totalAmountPaid
      - totalAmountUnpaid
      - status
      - earliestDateOfChange
      title: Asic484ShareStructure
      type: object
    Asic484Signature:
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/PersonName'
        role:
          description: DIR, SEC or ALT (alternate director)
          enum:
          - DIR
          - SEC
          - ALT
          title: Role
          type: string
        date:
          description: YYYY-MM-DD; not in the future and not more than 6 months ago
          format: date
          title: Date
          type: string
        declaresTrueAndCorrectIndicator:
          description: Must be true
          title: Declarestrueandcorrectindicator
          type: boolean
      required:
      - name
      - role
      - date
      - declaresTrueAndCorrectIndicator
      title: Asic484Signature
      type: object
    Asic484UltimateHoldingCompany:
      additionalProperties: false
      properties:
        dateOfChange:
          format: date
          title: Dateofchange
          type: string
        uhcStatus:
          description: A appointing · C ceasing · N notifying change
          enum:
          - A
          - C
          - N
          title: Uhcstatus
          type: string
        name:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          default: null
          title: Name
        acn:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Acn
        abn:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Abn
        placeIncorporation:
          anyOf:
          - maxLength: 50
            type: string
          - type: 'null'
          default: null
          description: Place of incorporation for a foreign holding company
          title: Placeincorporation
      required:
      - dateOfChange
      - uhcStatus
      title: Asic484UltimateHoldingCompany
      type: object
    Asic484FormRequest:
      additionalProperties: false
      description: 'ASIC Form 484 — Changes to Company Details. POST /asic-484-forms. Include only the sections that changed.

        testTransmissionIndicator is NOT a field here: the server sets it from its environment.'
      properties:
        generalInformation:
          $ref: '#/components/schemas/Asic484GeneralInformation'
        signature:
          $ref: '#/components/schemas/Asic484Signature'
        registeredOffice:
          anyOf:
          - $ref: '#/components/schemas/Asic484RegisteredOffice'
          - type: 'null'
          default: null
          description: Registered office address change
        principalPlaceOfBusiness:
          anyOf:
          - $ref: '#/components/schemas/Asic484PrincipalPlaceOfBusiness'
          - type: 'null'
          default: null
          description: Principal place of business change
        ultimateHoldingCompany:
          anyOf:
          - $ref: '#/components/schemas/Asic484UltimateHoldingCompany'
          - type: 'null'
          default: null
        officeHolders:
          anyOf:
          - items:
              $ref: '#/components/schemas/Asic484OfficeHolder'
            type: array
          - type: 'null'
          default: null
          description: Appointments, cessations, name/address changes
          title: Officeholders
        shareStructure:
          anyOf:
          - items:
              $ref: '#/components/schemas/Asic484ShareStructure'
            type: array
          - type: 'null'
          default: null
          description: Required with shareIssue / shareCancellation
          title: Sharestructure
        shareIssue:
          anyOf:
          - $ref: '#/components/schemas/Asic484ShareIssue'
          - type: 'null'
          default: null
        shareCancellation:
          anyOf:
          - $ref: '#/components/schemas/Asic484ShareCancellation'
          - type: 'null'
          default: null
        members:
          anyOf:
          - items:
              $ref: '#/components/schemas/Asic484Member'
            type: array
          - type: 'null'
          default: null
          description: Required with shareIssue / shareCancellation
          title: Members
        concessionalFees:
          anyOf:
          - $ref: '#/components/schemas/Asic484ConcessionalFees'
          - type: 'null'
          default: null
        annexures:
          anyOf:
          - items:
              $ref: '#/components/schemas/Asic484Annexure'
            type: array
          - type: 'null'
          default: null
          title: Annexures
        testTransmissionIndicator:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          description: 'Ignored: the server sets it from BAPI_ENV'
          title: Testtransmissionindicator
      required:
      - generalInformation
      - signature
      title: Asic484FormRequest
      type: object
    MonitoredEntityInput:
      additionalProperties: false
      description: 'One entity to monitor: a company by ACN, an ABN holder by ABN, or both (the ABR must confirm they match).'
      properties:
        acn:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: 9-digit ACN (companies are always keyed on their ACN)
          title: Acn
        abn:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: 11-digit ABN
          title: Abn
        reference:
          anyOf:
          - maxLength: 100
            type: string
          - type: 'null'
          default: null
          description: Your own reference for this entity, e.g. a client id
          title: Reference
      title: MonitoredEntityInput
      type: object
    AsicSignatory:
      additionalProperties: true
      description: 'Who signs the form: an individual with an ASIC role code, the signing date and the declaration.'
      properties:
        individual:
          $ref: '#/components/schemas/PersonName'
        role:
          description: Usually DIR or SEC for a company officer, AGT for the registered agent (Table 0011)
          enum:
          - ACC
          - AGT
          - APP
          - DIR
          - LEG
          - LP
          - REP
          - SCP
          - SEC
          - SIG
          - SUB
          title: Role
          type: string
        dateSigned:
          description: YYYY-MM-DD, not in the future
          format: date
          title: Datesigned
          type: string
        declaresTrueAndCorrectIndicator:
          description: Must be true
          title: Declarestrueandcorrectindicator
          type: boolean
      required:
      - individual
      - role
      - dateSigned
      - declaresTrueAndCorrectIndicator
      title: AsicSignatory
      type: object
    CompanyNameChangeGeneralInformation:
      additionalProperties: true
      properties:
        companyName:
          description: Current registered company name
          maxLength: 200
          title: Companyname
          type: string
        acn:
          description: 9-digit ACN (checksum validated)
          title: Acn
          type: string
        companyType:
          description: APTY for a Pty Ltd, APUB for a public company
          enum:
          - APUB
          - APTY
          - FNOS
          - RACN
          title: Companytype
          type: string
        proposedName:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          default: null
          description: New name INCLUDING legal elements, e.g. "NEW NAME PTY LTD"; required unless acnNameIndicator is true
          title: Proposedname
        acnNameIndicator:
          default: false
          description: true = the new name is the ACN plus legal elements
          title: Acnnameindicator
          type: boolean
        acnNameLegalElements:
          anyOf:
          - enum:
            - PTY
            - PTY.
            - PROPRIETARY
            - LTD
            - LTD.
            - LIMITED
            - NL
            - N.L.
            - NO LIABILITY
            type: string
          - type: 'null'
          default: null
          description: Required when acnNameIndicator is true
          title: Acnnamelegalelements
        nameReservedIndicator:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          description: true if the new name was reserved with a Form 410 (then supply nameReserved)
          title: Namereservedindicator
        nameIdenticalIndicator:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          description: true if the new name is identical to an existing registered business name
          title: Nameidenticalindicator
        nameIdenticalAbn:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: ABN of the business-name holder when nameIdenticalIndicator is true
          title: Nameidenticalabn
        meetingDate:
          description: Date of the members' meeting / special resolution (not in the future)
          format: date
          title: Meetingdate
          type: string
        meetingResolutionText:
          description: Text of the special resolution, e.g. "THAT THE NAME OF THE COMPANY BE CHANGED TO NEW NAME PTY LTD"
          title: Meetingresolutiontext
          type: string
        paymentMethod:
          description: DDEB (agent's direct debit account) or INV (ASIC invoice)
          enum:
          - DDEB
          - INV
          title: Paymentmethod
          type: string
      required:
      - companyName
      - acn
      - companyType
      - meetingDate
      - meetingResolutionText
      - paymentMethod
      title: CompanyNameChangeGeneralInformation
      type: object
    CompanyNameChangeRequest:
      additionalProperties: false
      description: 'ASIC Form 205A — change a registered company''s name. POST /company-name-changes.

        testTransmissionIndicator is NOT a field here: the server sets it from its environment.'
      properties:
        generalInformation:
          $ref: '#/components/schemas/CompanyNameChangeGeneralInformation'
        nameReserved:
          anyOf:
          - $ref: '#/components/schemas/NameReserved'
          - type: 'null'
          default: null
          description: Form 410 reservation details when nameReservedIndicator is true
        signatory:
          $ref: '#/components/schemas/AsicSignatory'
        admin:
          $ref: '#/components/schemas/Admin'
        testTransmissionIndicator:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          description: 'Ignored: the server sets it from BAPI_ENV'
          title: Testtransmissionindicator
      required:
      - generalInformation
      - signatory
      - admin
      title: CompanyNameChangeRequest
      type: object
    DeregistrationApplicant:
      additionalProperties: true
      description: 'The applicant: the company itself (organisation + role of the officer applying) or an individual such
        as a director or member.'
      properties:
        individual:
          anyOf:
          - $ref: '#/components/schemas/PersonName'
          - type: 'null'
          default: null
        organisation:
          anyOf:
          - $ref: '#/components/schemas/OrganisationRef'
          - type: 'null'
          default: null
        role:
          anyOf:
          - enum:
            - ACC
            - AGT
            - APP
            - DIR
            - LEG
            - LP
            - REP
            - SCP
            - SEC
            - SIG
            - SUB
            type: string
          - type: 'null'
          default: null
          description: Applicant's role, e.g. DIR
          title: Role
        address:
          anyOf:
          - $ref: '#/components/schemas/Address'
          - type: 'null'
          default: null
      title: DeregistrationApplicant
      type: object
    DeregistrationDeclarations:
      additionalProperties: false
      description: The six s.601AA conditions for voluntary deregistration. ASIC accepts the application only if ALL are true.
      properties:
        allMembersAgreeIndicator:
          description: All members of the company agree to the deregistration
          title: Allmembersagreeindicator
          type: boolean
        notCarryingOnBusinessIndicator:
          description: The company is not carrying on business
          title: Notcarryingonbusinessindicator
          type: boolean
        assetsLessThan1000Indicator:
          description: The company's assets are worth less than $1,000
          title: Assetslessthan1000Indicator
          type: boolean
        allFeesPaidIndicator:
          description: All fees and penalties payable under the Corporations Act have been paid
          title: Allfeespaidindicator
          type: boolean
        noOutstandingLiabilitiesIndicator:
          description: The company has no outstanding liabilities
          title: Nooutstandingliabilitiesindicator
          type: boolean
        notPartyToLegalProceedingsIndicator:
          description: The company is not a party to any legal proceedings
          title: Notpartytolegalproceedingsindicator
          type: boolean
      required:
      - allMembersAgreeIndicator
      - notCarryingOnBusinessIndicator
      - assetsLessThan1000Indicator
      - allFeesPaidIndicator
      - noOutstandingLiabilitiesIndicator
      - notPartyToLegalProceedingsIndicator
      title: DeregistrationDeclarations
      type: object
    DeregistrationGeneral:
      additionalProperties: true
      properties:
        companyName:
          maxLength: 200
          title: Companyname
          type: string
        acn:
          description: 9-digit ACN (checksum validated)
          title: Acn
          type: string
        paymentMethod:
          description: DDEB (agent's direct debit) or INV (ASIC invoice) for the deregistration fee
          enum:
          - DDEB
          - INV
          title: Paymentmethod
          type: string
      required:
      - companyName
      - acn
      - paymentMethod
      title: DeregistrationGeneral
      type: object
    DeregistrationNominee:
      additionalProperties: false
      description: Person nominated to receive ASIC correspondence about the deregistration.
      properties:
        individual:
          $ref: '#/components/schemas/PersonName'
        address:
          $ref: '#/components/schemas/Address'
      required:
      - individual
      - address
      title: DeregistrationNominee
      type: object
    CompanyDeregistrationRequest:
      additionalProperties: false
      description: 'ASIC Form 6010 — voluntary deregistration of a company. POST /company-deregistrations.

        testTransmissionIndicator is NOT a field here: the server sets it from its environment.'
      properties:
        general:
          $ref: '#/components/schemas/DeregistrationGeneral'
        declarations:
          $ref: '#/components/schemas/DeregistrationDeclarations'
        applicant:
          $ref: '#/components/schemas/DeregistrationApplicant'
        nominee:
          $ref: '#/components/schemas/DeregistrationNominee'
        signatory:
          $ref: '#/components/schemas/AsicSignatory'
        testTransmissionIndicator:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          description: 'Ignored: the server sets it from BAPI_ENV'
          title: Testtransmissionindicator
      required:
      - general
      - declarations
      - applicant
      - nominee
      - signatory
      title: CompanyDeregistrationRequest
      type: object
    Asic361Signature:
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/PersonName'
        role:
          const: AGT
          default: AGT
          description: Signed by the registered agent (AGT)
          title: Role
          type: string
        date:
          description: YYYY-MM-DD, not in the future
          format: date
          title: Date
          type: string
        agentAuthorisedIndicator:
          description: The agent is authorised to lodge; must be true
          title: Agentauthorisedindicator
          type: boolean
        declaration:
          description: Must be true
          title: Declaration
          type: boolean
      required:
      - name
      - date
      - agentAuthorisedIndicator
      - declaration
      title: Asic361Signature
      type: object
    AsicFormGeneralInformation:
      additionalProperties: false
      properties:
        companyName:
          maxLength: 200
          title: Companyname
          type: string
        acn:
          description: 9-digit ACN (checksum validated)
          title: Acn
          type: string
      required:
      - companyName
      - acn
      title: AsicFormGeneralInformation
      type: object
    Asic361FormRequest:
      additionalProperties: false
      description: ASIC Form 361 — notification by a registered agent that it ceases to act for a company. POST /asic-361-forms.
      properties:
        generalInformation:
          $ref: '#/components/schemas/AsicFormGeneralInformation'
        signature:
          $ref: '#/components/schemas/Asic361Signature'
        testTransmissionIndicator:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          description: 'Ignored: the server sets it from BAPI_ENV'
          title: Testtransmissionindicator
      required:
      - generalInformation
      - signature
      title: Asic361FormRequest
      type: object
    Asic362GeneralInformation:
      additionalProperties: false
      properties:
        companyName:
          maxLength: 200
          title: Companyname
          type: string
        acn:
          description: 9-digit ACN (checksum validated)
          title: Acn
          type: string
        type:
          description: A = appoint your agent number for this company · C = cease the appointment
          enum:
          - A
          - C
          title: Type
          type: string
      required:
      - companyName
      - acn
      - type
      title: Asic362GeneralInformation
      type: object
    Asic362Signature:
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/PersonName'
        role:
          description: Signed by an officer of the company (DIR or SEC)
          enum:
          - DIR
          - SEC
          title: Role
          type: string
        date:
          description: YYYY-MM-DD, not in the future
          format: date
          title: Date
          type: string
        declaration:
          description: Must be true
          title: Declaration
          type: boolean
      required:
      - name
      - role
      - date
      - declaration
      title: Asic362Signature
      type: object
    Asic362FormRequest:
      additionalProperties: false
      description: ASIC Form 362 — a company appoints (A) or ceases (C) a registered agent. POST /asic-362-forms.
      properties:
        generalInformation:
          $ref: '#/components/schemas/Asic362GeneralInformation'
        signature:
          $ref: '#/components/schemas/Asic362Signature'
        testTransmissionIndicator:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          description: 'Ignored: the server sets it from BAPI_ENV'
          title: Testtransmissionindicator
      required:
      - generalInformation
      - signature
      title: Asic362FormRequest
      type: object
    AsicRa52General:
      additionalProperties: false
      properties:
        startDate:
          format: date
          title: Startdate
          type: string
        endDate:
          format: date
          title: Enddate
          type: string
        includePriorOutstandingIndicator:
          default: false
          description: Also list transactions from before startDate that are still outstanding
          title: Includeprioroutstandingindicator
          type: boolean
      required:
      - startDate
      - endDate
      title: AsicRa52General
      type: object
    AsicRa52Request:
      additionalProperties: false
      description: ASIC Form RA52 — report of all ASIC account transactions for the registered agent over a period. POST /asic-ra52-forms.
      properties:
        general:
          $ref: '#/components/schemas/AsicRa52General'
      required:
      - general
      title: AsicRa52Request
      type: object
paths:
  /helpers/company-name-availability:
    get:
      operationId: check_company_name_availability
      summary: Check whether a proposed company name is available with ASIC (free helper).
      parameters:
      - name: name
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Availability result
  /helpers/business-name-availability:
    get:
      operationId: check_business_name_availability
      summary: Check whether a proposed business (trading) name is available (free helper).
      parameters:
      - name: name
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Availability result
  /helpers/business-industries:
    get:
      operationId: search_business_industries
      summary: Search ATO main-business-activity codes by keyword; returns activities[] {score, code, industryCode, fullName}.
      parameters:
      - name: searchTerm
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '{searchTerm, activitiesCount, activities[]}'
  /helpers/entitlement-questionnaire:
    get:
      operationId: get_abn_entitlement_questionnaire
      summary: ABN entitlement questionnaire for an ATO entity type / sub-type (answers go into entitlement.questionnaire).
      parameters:
      - name: entityType
        in: query
        required: true
        schema:
          type: string
      - name: entitySubType
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: questionnaire
  /lookup/abn/{abn}:
    get:
      operationId: lookup_abn
      summary: Validate an ABN (11 digits) and look up the entity on the ABR. Free, read-only.
      parameters:
      - name: abn
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9]{11}$
      responses:
        '200':
          description: Entity details
  /lookup/acn/{acn}:
    get:
      operationId: lookup_acn
      summary: Validate an ACN (9 digits) and look up the company on ASIC. Free, read-only.
      parameters:
      - name: acn
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9]{9}$
      responses:
        '200':
          description: Company details
  /ppsr/searches:
    post:
      operationId: create_ppsr_search
      summary: Create a PPSR search ($6.00 per search in LIVE). Returns requestId; poll get_ppsr_search.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PpsrSearchRequest'
      responses:
        '201':
          description: '{requestId, status: new}'
  /ppsr/searches/{requestId}:
    get:
      operationId: get_ppsr_search
      summary: Poll a PPSR search (new -> processing -> completed | failed); results under data.
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Search status / results
  /status/{requestId}:
    get:
      operationId: get_request_status
      summary: Poll any lodgement by requestId (see LodgementStatus lifecycle).
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Lodgement status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LodgementStatus'
  /account-status:
    get:
      operationId: get_account_status
      summary: Plan / billing / scope state of the current API key.
      responses:
        '200':
          description: Account status
  /company-registrations:
    post:
      operationId: lodge_company_registration
      summary: 'Lodge ASIC Form 201 (new company). LIVE ≈ $50 + ASIC fee. Returns {response: {requestId}}; poll /status/{requestId}.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
