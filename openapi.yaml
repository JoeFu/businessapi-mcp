          type: integer
      responses:
        '200':
          description: Status
  /monitoring/entities:
    post:
      operationId: start_entity_monitoring
      summary: Start monitoring up to 25 entities for 12 months ($18 each live). Send an Idempotency-Key header.
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - entities
              properties:
                entities:
                  type: array
                  minItems: 1
                  maxItems: 25
                  items:
                    $ref: '#/components/schemas/MonitoredEntityInput'
      responses:
        '201':
          description: '{unitPrice, total, entities[]}'
        '422':
          description: validation_failed with per-row errors
    get:
      operationId: list_monitored_entities
      summary: 'List monitored entities. Filters: status, acn, abn, expiresBefore, perPage (≤100), page.'
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - processing
          - active
          - stopped
          - expired
      - name: acn
        in: query
        schema:
          type: string
      - name: abn
        in: query
        schema:
          type: string
      - name: expiresBefore
        in: query
        schema:
          type: string
          format: date
      - name: perPage
        in: query
        schema:
          type: integer
          maximum: 100
      - name: page
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: data[] + meta
  /monitoring/entities/renew:
    post:
      operationId: renew_entity_monitoring
      summary: Renew up to 25 entities for another 12 months ($18 each live). Idempotency-Key header REQUIRED.
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ids
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 25
                  items:
                    type: integer
      responses:
        '201':
          description: '{unitPrice, total, entities[]}'
  /monitoring/entities/{id}:
    get:
      operationId: get_monitored_entity
      summary: One monitored entity.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: entity object
    delete:
      operationId: stop_entity_monitoring
      summary: Stop monitoring now (no refund; resumable while the term runs).
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: entity with status stopped
  /monitoring/entities/{id}/resume:
    post:
      operationId: resume_entity_monitoring
      summary: Resume a stopped entity whose paid term is still running (free).
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: entity
  /monitoring/entities/{id}/snapshot:
    get:
      operationId: get_entity_snapshot
      summary: Current record from every monitored source (JSON). Active entities only.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: '{entity, snapshot}'
  /monitoring/entities/{id}/events:
    get:
      operationId: list_entity_monitoring_events
      summary: That entity's events, newest first.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: perPage
        in: query
        schema:
          type: integer
          maximum: 100
      - name: page
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: data[] + meta
  /monitoring/events:
    get:
      operationId: list_monitoring_events
      summary: All events oldest first; since = last monitoringEventId or ISO date-time.
      parameters:
      - name: since
        in: query
        schema:
          type: string
      - name: perPage
        in: query
        schema:
          type: integer
          maximum: 100
      - name: page
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: data[] + meta
  /monitoring/events/{id}:
    get:
