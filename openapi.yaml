  /webhooks:
    get:
      operationId: list_webhooks
      summary: List webhook endpoints for this API key (secrets omitted).
      responses:
        '200':
          description: endpoints
    post:
      operationId: create_webhook
      summary: Register a webhook endpoint (HTTPS, public host; ≤10 per key). The signing secret is returned ONCE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - url
              - eventTypes
              properties:
                url:
                  type: string
                  format: uri
                eventTypes:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum: &id001
                    - '*'
                    - company_registration.status_changed
                    - abn_registration.status_changed
                    - business_name_registration.status_changed
                    - business_name_renewal.status_changed
                    - ppsr.alert.grantor_registration_changed
                    - monitoring.change_detected
                    - monitoring.expiring
                    - monitoring.expired
      responses:
        '201':
          description: endpoint incl. secret (whsec_…)
  /webhooks/{id}:
    patch:
      operationId: update_webhook
      summary: Update URL, event types or enabled flag.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                eventTypes:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum: *id001
                enabled:
                  type: boolean
      responses:
        '200':
          description: endpoint
    delete:
      operationId: delete_webhook
      summary: Remove a webhook endpoint.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: deleted
  /webhooks/{id}/rotate-secret:
    post:
      operationId: rotate_webhook_secret
      summary: Invalidate the signing secret and issue a new one (returned once).
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: endpoint incl. new secret
