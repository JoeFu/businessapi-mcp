# Business API (businessapi.com.au) v2 — OpenAPI 3.1 for route B (server_from_openapi.py).
# The vendor publishes no machine-readable spec; this file is hand-maintained EXCEPT the three lodgement
# request schemas and their paths, which export_openapi.py regenerates from models.py (comments are not
# preserved by the YAML dumper, so keep notes here in the header).
# Paths are relative to the v2 root; the HTTP client supplies /api/v2 or /api/test/v2 from BAPI_ENV.
# Covered: helpers, lookup, PPSR, status, company/ABN/business-name registration, business-name renewal, Forms 484/205A/
# 6010/361/362/RA52, entity monitoring, webhooks. Not covered (no public docs page): name reservations, extracts,
# tax/registrations, asic-370/492/902/ra17/ra50/ra51/ra61/ra63/ra65/ra67/ra71-forms, asic-inbox.
openapi: 3.1.0
info:
  title: Business API (AU) v2
  version: '2'
  description: 'Australian ASIC / ATO / ABRS / PPSR digital-service-provider API.

    Lodgements are asynchronous: POST returns a requestId; poll GET /status/{requestId}

    (status: new -> transmission ok -> validation ok | validation failed -> manual review -> finished | rejected).

    Live calls are billed (company registration ~$50, ABN ~$25, business name ~$15, PPSR search $6).

    '
servers:
- url: https://businessapi.com.au/api/test/v2
  description: Sandbox (bapi_sk_test_ keys, $0)
- url: https://businessapi.com.au/api/v2
  description: Live (bapi_sk_live_ keys, billed)
security:
- bearer: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: 'Authorization: Bearer bapi_sk_{test|live}_...'
  schemas:
    ErrorEnvelope:
      type: object
      properties:
        errors:
          type: array
          items:
            oneOf:
            - type: string
            - type: object
              properties:
                details:
                  type: string
                target:
                  type: string
    LodgementStatus:
      type: object
      properties:
        requestId:
          type: integer
        status:
          type: string
          description: new | transmission ok | validation ok | validation failed | manual review | finished | rejected
        documentNumber:
          type: string
        response:
          type: object
        warnings: {}
        errors: {}
    PpsrSearchRequest:
      type: object
      description: Send exactly ONE identifier set; the search type is inferred from the fields present.
      properties:
        abn:
          type: string
          pattern: ^[0-9]{11}$
          description: Grantor search by ABN
        acn:
          type: string
          pattern: ^[0-9]{9}$
          description: Grantor search by ACN
        arbn:
          type: string
          pattern: ^[0-9]{9}$
        arsn:
          type: string
          pattern: ^[0-9]{9}$
        vin:
          type: string
          maxLength: 17
          description: Vehicle serial search + NEVDIS data
        serialNumber:
          type: string
          maxLength: 17
          description: Non-VIN serial; requires serialNumberType
        serialNumberType:
          type: string
          enum:
          - ChassisNumber
          - HIN
          - OfficialNumber
        registrationNumber:
          type: string
          maxLength: 20
          description: Look up one PPSR registration (no certificate)
        organisationName:
          type: string
          maxLength: 255
        familyName:
          type: string
          maxLength: 255
          description: Individual search (with givenNames
          dateOfBirth: null
          authorisedPurpose): null
        givenNames:
          type: string
          maxLength: 255
        dateOfBirth:
          type: string
          format: date
        authorisedPurpose:
          type: boolean
          description: Must be true for individual searches (PPS Act authorised purpose)
      additionalProperties: false
    Address:
      additionalProperties: false
      description: Address of a person or organisation; may be overseas. Australian addresses need state + postcode.
      properties:
        careOf:
          anyOf:
          - maxLength: 50
            type: string
          - type: 'null'
          default: null
          title: Careof
        line2:
          anyOf:
          - maxLength: 50
            type: string
          - type: 'null'
          default: null
          description: Unit / floor / building
          title: Line2
        street:
          maxLength: 52
          title: Street
          type: string
        locality:
          description: Suburb / town / city
          maxLength: 30
          title: Locality
          type: string
        state:
          anyOf:
          - enum:
            - ACT
            - CCK
            - CXR
            - JBT
            - NSW
            - NFK
            - NT
            - QLD
            - SA
            - TAS
            - VIC
            - WA
            type: string
          - type: 'null'
          default: null
          description: Required when country is AU
          title: State
        postcode:
          anyOf:
          - pattern: ^\d{4}$
            type: string
          - type: 'null'
          default: null
          description: Required when country is AU
          title: Postcode
        country:
          default: AU
          description: ISO 3166-1 alpha-2 code, e.g. AU, NZ, GB
          maxLength: 2
          minLength: 2
          title: Country
          type: string
      required:
      - street
      - locality
      title: Address
      type: object
    Admin:
      additionalProperties: false
      properties:
        manualReviewIndicator:
          description: Ask Business API staff to review before transmission
          title: Manualreviewindicator
          type: boolean
        manualReviewText:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Required when manualReviewIndicator is true
          title: Manualreviewtext
      required:
      - manualReviewIndicator
      title: Admin
      type: object
    Applicant:
      additionalProperties: false
      description: Who is lodging the application (an individual, or an organisation plus its signatory).
      properties:
        individual:
          anyOf:
          - $ref: '#/components/schemas/PersonName'
          - type: 'null'
          default: null
        organisation:
          anyOf:
          - $ref: '#/components/schemas/OrganisationRef'
          - type: 'null'
          default: null
        organisationSignatoryIndividual:
          anyOf:
          - $ref: '#/components/schemas/PersonName'
          - type: 'null'
          default: null
          description: Required when the applicant is an organisation
        organisationSignatoryRole:
          anyOf:
          - enum:
            - DIR
            - SEC
            - ALT
            - AGT
            type: string
          - type: 'null'
          default: null
          description: DIR, SEC, ALT or AGT; required when the applicant is an organisation
          title: Organisationsignatoryrole
        address:
          $ref: '#/components/schemas/Address'
        dateSigned:
          description: YYYY-MM-DD, not in the future
          format: date
          title: Datesigned
          type: string
        declaresTrueAndCorrectIndicator:
          description: Must be true
          title: Declarestrueandcorrectindicator
          type: boolean
      required:
      - address
      - dateSigned
      - declaresTrueAndCorrectIndicator
      title: Applicant
      type: object
    AuStreetAddress:
      additionalProperties: false
      description: Australian street address for the registered office / principal place of business (no PO boxes).
      properties:
        careOf:
          anyOf:
          - maxLength: 50
            type: string
          - type: 'null'
          default: null
          description: C/- line, if any
          title: Careof
        line2:
          anyOf:
          - maxLength: 50
            type: string
          - type: 'null'
          default: null
          description: Unit / floor / building
          title: Line2
        street:
          description: Street number and name, e.g. "9 KENT STREET"
          maxLength: 52
          title: Street
          type: string
        locality:
          description: Suburb / town
          maxLength: 30
          title: Locality
          type: string
        state:
          enum:
          - ACT
          - CCK
          - CXR
          - JBT
          - NSW
          - NFK
          - NT
          - QLD
          - SA
          - TAS
          - VIC
          - WA
          title: State
          type: string
        postcode:
          pattern: ^\d{4}$
          title: Postcode
          type: string
      required:
      - street
      - locality
      - state
      - postcode
      title: AuStreetAddress
      type: object
    BirthDetails:
      additionalProperties: false
      properties:
        date:
          description: YYYY-MM-DD; officeholder must be 18+
          format: date
          title: Date
          type: string
        locality:
          description: Birth suburb (Australia) or city (overseas)
          maxLength: 30
          title: Locality
          type: string
        localityQualifier:
          description: Birth state code (ACT, NSW, …) or 2-letter ISO country code when born overseas
          maxLength: 3
          title: Localityqualifier
          type: string
        intlIndicator:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          description: true when born overseas (localityQualifier is then a country code)
          title: Intlindicator
      required:
      - date
      - locality
      - localityQualifier
      title: BirthDetails
      type: object
    GeneralInformation:
      additionalProperties: false
      description: Company name, type/class/sub-class and jurisdiction.
      properties:
        companyName:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          default: null
          description: Full proposed name INCLUDING legal elements, e.g. "ACME TRADING PTY LTD". Required unless acnNameIndicator
            is true.
          title: Companyname
        acnNameIndicator:
          description: true = the company will be named by its ACN (e.g. 'A.C.N. 123 456 789 PTY LTD')
          title: Acnnameindicator
          type: boolean
        acnNameLegalElements:
          anyOf:
          - enum:
            - PTY
            - PTY.
            - PROPRIETARY
            - LTD
            - LTD.
            - LIMITED
            - NL
            - N.L.
            - NO LIABILITY
            type: string
          - type: 'null'
          default: null
          description: Legal elements for an ACN-named company (required when acnNameIndicator is true)
          title: Acnnamelegalelements
        companyType:
          description: APTY for a Pty Ltd, APUB for a public company
          enum:
          - APUB
          - APTY
          - FNOS
          - RACN
          title: Companytype
          type: string
        companyClass:
          description: LMSH for an ordinary company limited by shares
          enum:
          - LMGT
          - LMSG
          - LMSH
          - NLIA
          - UNLM
          title: Companyclass
          type: string
        companySubClass:
          description: PROP for an ordinary proprietary company
          enum:
          - PNPC
          - PSTC
          - HUNT
          - PROP
          - LISN
          - LISS
          - LIST
          - STFI
          - NLTD
          - ULSN
          - ULSS
          - ULST
          title: Companysubclass
          type: string
        jurisdiction:
          description: State/territory of registration
          enum:
          - ACT
          - CCK
          - CXR
          - JBT
          - NSW
          - NFK
          - NT
          - QLD
          - SA
          - TAS
          - VIC
          - WA
          title: Jurisdiction
          type: string
        governedByConstitution:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          description: Required for APUB companies of class NLIA/LMGT with sub-class ULSN/ULSS
          title: Governedbyconstitution
        nonCashSharesIndicator:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          description: 'Required for APUB + LMSH: will any shares be issued for non-cash consideration?'
          title: Noncashsharesindicator
        nameReservedIndicator:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          description: true if the name was reserved with a Form 410 (then supply nameReserved)
          title: Namereservedindicator
        nameIdenticalIndicator:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          description: true if the name is identical to an existing registered business name
          title: Nameidenticalindicator
        nameIdenticalAbn:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: ABN of the business-name holder; required when nameIdenticalIndicator is true
          title: Nameidenticalabn
        residentialOfficeholders:
          description: Are all officeholder addresses their usual residential addresses?
          title: Residentialofficeholders
          type: boolean
      required:
      - acnNameIndicator
      - companyType
      - companyClass
      - companySubClass
      - jurisdiction
      - residentialOfficeholders
      title: GeneralInformation
      type: object
    NameIdentical:
      additionalProperties: false
      properties:
        state:
          enum:
          - ACT
          - NSW
          - NT
          - QLD
          - SA
          - TAS
          - VIC
          - WA
          title: State
          type: string
        registrationNumber:
          description: State registration number of the business name
          maxLength: 10
          title: Registrationnumber
          type: string
      required:
      - state
      - registrationNumber
      title: NameIdentical
      type: object
    NameReserved:
      additionalProperties: false
      description: Details of the Form 410 name reservation (who reserved it + reservation document number).
      properties:
        individual:
          anyOf:
          - $ref: '#/components/schemas/PersonName'
          - type: 'null'
          default: null
        organisation:
          anyOf:
          - $ref: '#/components/schemas/OrganisationRef'
          - type: 'null'
          default: null
        documentNumber:
          description: Form 410 reservation document number
          maxLength: 9
          title: Documentnumber
          type: string
      required:
      - documentNumber
      title: NameReserved
      type: object
    OfficeHolder:
      additionalProperties: false
      description: A director (DIR) or secretary (SEC). A proprietary company needs at least one director resident in Australia.
      properties:
        name:
          $ref: '#/components/schemas/PersonName'
        birthDetails:
          $ref: '#/components/schemas/BirthDetails'
        address:
          $ref: '#/components/schemas/Address'
          description: Usual residential address
        addressOverriddenIndicator:
          default: false
          description: Required by the API although the vendor's Form 201 page omits it (sandbox returns 400 without it).
            false = lodge the address as entered; true = override ASIC's address validation.
          title: Addressoverriddenindicator
          type: boolean
        formerName:
          anyOf:
          - $ref: '#/components/schemas/PersonName'
          - type: 'null'
          default: null
        roles:
          description: e.g. ["DIR"] or ["DIR", "SEC"]
          items:
            enum:
            - DIR
            - SEC
            type: string
          minItems: 1
          title: Roles
          type: array
      required:
      - name
      - birthDetails
      - address
      - roles
      title: OfficeHolder
      type: object
    OpenHours:
      additionalProperties: false
      properties:
        openHour:
          description: HHMM 24h, e.g. 0900
          pattern: ^\d{4}$
          title: Openhour
          type: string
        closeHour:
          description: HHMM 24h, e.g. 1700
          pattern: ^\d{4}$
          title: Closehour
          type: string
      required:
      - openHour
      - closeHour
      title: OpenHours
      type: object
    OrganisationRef:
      additionalProperties: false
      description: A company / body named in the application.
      properties:
        name:
          maxLength: 200
          title: Name
          type: string
        acn:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: 9-digit ACN or ARBN (spaces allowed; checksum validated)
          title: Acn
      required:
      - name
      title: OrganisationRef
      type: object
    Party:
      additionalProperties: false
      description: An individual OR an organisation (exactly one) with an address — used for shareholders and members.
      properties:
        individual:
          anyOf:
          - $ref: '#/components/schemas/PersonName'
          - type: 'null'
          default: null
        organisation:
          anyOf:
          - $ref: '#/components/schemas/OrganisationRef'
          - type: 'null'
          default: null
        address:
          $ref: '#/components/schemas/Address'
      required:
      - address
      title: Party
      type: object
    PersonName:
      additionalProperties: false
      description: A natural person's name as ASIC wants it (no company words such as PTY or LTD).
      properties:
        familyName:
          maxLength: 30
          title: Familyname
          type: string
        givenName1:
          description: First given name
          maxLength: 20
          title: Givenname1
          type: string
        givenName2:
          anyOf:
          - maxLength: 20
            type: string
          - type: 'null'
          default: null
          title: Givenname2
        givenName3:
          anyOf:
          - maxLength: 20
            type: string
          - type: 'null'
          default: null
          title: Givenname3
      required:
      - familyName
      - givenName1
      title: PersonName
      type: object
    PrincipalPlaceOfBusiness:
      additionalProperties: false
      properties:
        address:
          $ref: '#/components/schemas/AuStreetAddress'
      required:
      - address
      title: PrincipalPlaceOfBusiness
      type: object
    RegisteredOffice:
      additionalProperties: false
      description: Registered office address, occupier and opening hours.
      properties:
        address:
          $ref: '#/components/schemas/AuStreetAddress'
        occupyIndicator:
          description: Will the new company itself occupy the premises?
          title: Occupyindicator
          type: boolean
        occupierName:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          default: null
          description: Required when occupyIndicator is false
          title: Occupiername
        occupierConsent:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          description: Required when occupyIndicator is false; must be true
          title: Occupierconsent
        openStandardHoursIndicator:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          description: Required for APUB companies
          title: Openstandardhoursindicator
        openHours:
          anyOf:
          - items:
              $ref: '#/components/schemas/OpenHours'
            type: array
          - type: 'null'
          default: null
          description: Required when openStandardHoursIndicator is false
          title: Openhours
      required:
      - address
      - occupyIndicator
      title: RegisteredOffice
      type: object
    ShareAllocation:
      additionalProperties: false
      description: Shares taken up by one holding (one or more joint holders) in one class.
      properties:
        classCode:
          description: Must match a shareStructure classCode
          maxLength: 4
          title: Classcode
          type: string
        numberIssued:
          description: Number of shares in this holding
          minimum: 1
          title: Numberissued
          type: integer
        fullyPaidIndicator:
          title: Fullypaidindicator
          type: boolean
        totalAmountPaid:
          description: Cents-style integer, see ShareStructure
          minimum: 0
          title: Totalamountpaid
          type: integer
        totalAmountUnpaid:
          minimum: 0
          title: Totalamountunpaid
          type: integer
        amountPaidPerShare:
          minimum: 0
          title: Amountpaidpershare
          type: integer
        amountUnpaidPerShare:
          minimum: 0
          title: Amountunpaidpershare
          type: integer
        beneficialOwnerIndicator:
          description: Are the holders the beneficial owners?
          title: Beneficialownerindicator
          type: boolean
        beneficialOwner:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          default: null
          description: Required when beneficialOwnerIndicator is false
          title: Beneficialowner
        holdingOwners:
          items:
            $ref: '#/components/schemas/Party'
          minItems: 1
          title: Holdingowners
          type: array
      required:
      - classCode
      - numberIssued
      - fullyPaidIndicator
      - totalAmountPaid
      - totalAmountUnpaid
      - amountPaidPerShare
      - amountUnpaidPerShare
      - beneficialOwnerIndicator
      - holdingOwners
      title: ShareAllocation
      type: object
    ShareStructure:
      additionalProperties: false
      description: 'One share class. Money fields are integers whose last two digits are cents (100 = $1.00) per the

        vendor''s validation rules — the vendor''s own sample payload is ambiguous on this, so confirm in the sandbox.'
      properties:
        classCode:
          description: e.g. ORD
          maxLength: 4
          title: Classcode
          type: string
        classTitle:
          description: e.g. ORDINARY
          maxLength: 60
          title: Classtitle
          type: string
        numberIssued:
          minimum: 1
          title: Numberissued
          type: integer
        totalAmountPaid:
          minimum: 0
          title: Totalamountpaid
          type: integer
        totalAmountUnpaid:
          minimum: 0
          title: Totalamountunpaid
          type: integer
      required:
      - classCode
      - classTitle
      - numberIssued
      - totalAmountPaid
      - totalAmountUnpaid
      title: ShareStructure
      type: object
    UltimateHoldingCompany:
      additionalProperties: false
      properties:
        name:
          maxLength: 200
          title: Name
          type: string
        acn:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Required when country is AU
          title: Acn
        abn:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Abn
        country:
          description: ISO alpha-2 code preferred (NZ); the vendor sample uses a name (NEW ZEALAND)
          maxLength: 60
          minLength: 2
          title: Country
          type: string
      required:
      - name
      - country
      title: UltimateHoldingCompany
      type: object
    CompanyRegistrationRequest:
      additionalProperties: false
      description: ASIC Form 201 — register a new Australian company. POST /company-registrations.
      properties:
        generalInformation:
          $ref: '#/components/schemas/GeneralInformation'
        nameReserved:
          anyOf:
          - $ref: '#/components/schemas/NameReserved'
          - type: 'null'
          default: null
          description: Required when generalInformation.nameReservedIndicator is true
        nameIdentical:
          anyOf:
          - items:
              $ref: '#/components/schemas/NameIdentical'
            type: array
          - type: 'null'
          default: null
          description: State registrations of the identical business name (when no nameIdenticalAbn)
          title: Nameidentical
        registeredOffice:
          $ref: '#/components/schemas/RegisteredOffice'
        principalPlaceOfBusiness:
          $ref: '#/components/schemas/PrincipalPlaceOfBusiness'
        ultimateHoldingCompany:
          anyOf:
          - $ref: '#/components/schemas/UltimateHoldingCompany'
          - type: 'null'
          default: null
        officeHolders:
          items:
            $ref: '#/components/schemas/OfficeHolder'
          minItems: 1
          title: Officeholders
          type: array
        shareStructure:
          anyOf:
          - items:
              $ref: '#/components/schemas/ShareStructure'
            type: array
          - type: 'null'
          default: null
          description: Required unless companyClass is LMGT
          title: Sharestructure
        shareAllocation:
          anyOf:
          - items:
              $ref: '#/components/schemas/ShareAllocation'
            type: array
          - type: 'null'
          default: null
          description: Required unless companyClass is LMGT
          title: Shareallocation
        nonShareMembersAmount:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          description: Members' guarantee amount (cents-style); required for LMGT
          title: Nonsharemembersamount
        nonShareMembers:
          anyOf:
          - items:
              $ref: '#/components/schemas/Party'
            type: array
          - type: 'null'
          default: null
          description: Required for LMGT
          title: Nonsharemembers
        applicant:
          $ref: '#/components/schemas/Applicant'
        admin:
          $ref: '#/components/schemas/Admin'
      required:
      - generalInformation
      - registeredOffice
      - principalPlaceOfBusiness
      - officeHolders
      - applicant
      - admin
      title: CompanyRegistrationRequest
      type: object
    AbnApplicant:
      additionalProperties: true
      description: Exactly one of individual (sole trader) or organisation (everything else).
      properties:
        individual:
          anyOf:
          - $ref: '#/components/schemas/AbnIndividual'
          - type: 'null'
          default: null
        organisation:
          anyOf:
          - $ref: '#/components/schemas/AbnOrganisation'
          - type: 'null'
          default: null
        tfn:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Applicant's existing TFN, digits only; send it when applicationDetail.tfnIndicator is true
          title: Tfn
      title: AbnApplicant
      type: object
    AbnIndividual:
      additionalProperties: true
      description: The sole-trader applicant. Residential address fields are checked by Business API but not sent to the ATO.
      properties:
        title:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Mr, Mrs, Ms, Dr …
          title: Title
        familyName:
          title: Familyname
          type: string
        givenName:
          title: Givenname
          type: string
        otherGivenName:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Othergivenname
        dateOfBirth:
          format: date
          title: Dateofbirth
          type: string
        genderCode:
          anyOf:
          - enum:
            - '0'
            - '1'
            - '2'
            - '3'
            type: string
          - type: 'null'
          default: null
          title: Gendercode
        line2:
          anyOf:
          - maxLength: 38
            type: string
          - type: 'null'
          default: null
          title: Line2
        street:
          anyOf:
          - maxLength: 38
            type: string
          - type: 'null'
          default: null
